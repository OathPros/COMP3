pages:
  stage: deploy
  needs: []
  script:
    - dnf install -y python3-sphinx python3-pip
    - pip3 install --upgrade furo
    - pip3 install --upgrade recommonmark
    - pip3 install --upgrade sphinx-markdown-tables
    - sphinx-build -b html source build
    - mv build public
  artifacts:
    paths:
      - public
  only:
    - master

