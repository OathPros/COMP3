image: fedora:latest

pages:
  stage: deploy
  needs: []
  script:
    - dnf install -y python3-pip git gcc dbus-devel glib2-devel
    - pip3 install -r requirements.txt
    - sphinx-build -b html source build
    - mv build/_static/404.html build/404.html
    - mv build public
  artifacts:
    paths:
      - public
  only:
    - main

